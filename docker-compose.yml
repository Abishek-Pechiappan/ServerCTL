services:
  backend:
    build:
      context: ./backend
    image: serverctl-backend
    container_name: serverctl-backend
    restart: unless-stopped
    network_mode: host
    pid: host
    env_file:
      - ./backend/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.cloudflared:/root/.cloudflared:ro
      - /var/log/wtmp:/var/log/wtmp:ro
      - /run/utmp:/run/utmp:ro

  frontend:
    build:
      context: ./frontend/serverctl
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
    image: serverctl-frontend
    container_name: serverctl-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
