# ServerCTL reverse proxy — serves the dashboard and the API from ONE origin.
#
# Why this exists: NEXT_PUBLIC_API_URL is baked into the JS bundle at build time
# and resolved by the *browser*, not by any container. Serving the UI on :3000
# and the API on :8001 makes them two separate origins, so every call needs CORS
# and an ALLOWED_ORIGINS entry that matches the address bar exactly (localhost
# and 127.0.0.1 are NOT the same origin to a browser). Proxying both under one
# server block makes /api/* same-origin, and same-origin requests never
# preflight — the whole class of CORS bugs disappears.
#
# Requires the frontend built with NEXT_PUBLIC_API_URL=/api — see Readme.md.
# Run `python preflight.py` to check this and everything else.
#
# Install (Arch):
#   sudo cp nginx/serverctl.conf /etc/nginx/conf.d/serverctl.conf
# Install (Debian/Ubuntu):
#   sudo ln -s "$PWD/nginx/serverctl.conf" /etc/nginx/sites-enabled/serverctl.conf
# Then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE: headers below are written out explicitly rather than pulled in with
# `include proxy_params;` — that file ships only on Debian/Ubuntu, so including
# it makes this config fail to load on Arch with "open() ... failed (2)".

# Brute-force protection for the login endpoint. ServerCTL has a single admin
# account and the backend mounts docker.sock, so /api/login is by far the
# highest-value target once this is reachable from the internet.
limit_req_zone $binary_remote_addr zone=serverctl_login:10m rate=5r/m;

# Next.js only needs the Upgrade dance for dev-mode HMR, but keeping it costs
# nothing and avoids a confusing hang if anyone points this at `npm run dev`.
map $http_upgrade $serverctl_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your tunnel hostname once cloudflared is routing to this.
    server_name _;

    # cloudflared terminates TLS upstream and forwards plain HTTP here, so there
    # is deliberately no 443 block. If you expose this box directly instead, add
    # one and redirect 80 -> 443; the backend already sends HSTS.

    # Every endpoint takes small JSON. Capping this keeps a hostile request from
    # buffering megabytes before auth is ever checked.
    client_max_body_size 64k;

    # nginx's own version banner; the backend already masks its Server header.
    server_tokens off;

    # ---- API ---------------------------------------------------------------
    # The trailing slash on proxy_pass strips the /api prefix: a browser request
    # for /api/system/monitor reaches the backend as /system/monitor, which is
    # how the FastAPI routes are actually declared in backend/agent/route.py.
    # Removing that slash silently 404s every endpoint.
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /system/upgrade shells out to a package manager and can run long.
        proxy_read_timeout 300s;
    }

    # Declared separately (and before /api/ would otherwise match) so the rate
    # limit applies only to auth attempts, not to dashboard polling. `= ` makes
    # this an exact match, which nginx prefers over the /api/ prefix above.
    location = /api/login {
        limit_req      zone=serverctl_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8001/login;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Dashboard ---------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $serverctl_connection_upgrade;
    }
}
