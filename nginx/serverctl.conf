# Optional front proxy for ServerCTL.
#
# You do NOT need this to run ServerCTL. The container already serves the
# dashboard and the API from a single process on 127.0.0.1:3000, so there is no
# routing to do and no CORS to configure. This file exists for two things:
#
#   1. Serving on port 80/443 instead of 3000.
#   2. Terminating TLS yourself, if you are not using a cloudflared tunnel.
#
# If you only want a tunnel, point cloudflared straight at 127.0.0.1:3000 and
# skip nginx entirely.
#
# Install (Arch):
#   sudo cp nginx/serverctl.conf /etc/nginx/conf.d/serverctl.conf
# Install (Debian/Ubuntu):
#   sudo ln -s "$PWD/nginx/serverctl.conf" /etc/nginx/sites-enabled/serverctl.conf
# Then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE: the proxy headers below are written out explicitly rather than pulled in
# with `include proxy_params;` — that file ships only on Debian/Ubuntu, so
# including it makes this config fail to load on Arch with "open() ... failed (2)".

# Next's hashed asset filenames change on every build, so they are safe to cache
# hard. Everything else must not be cached, or a logged-out user can be served a
# stale dashboard shell.
map $uri $serverctl_cache {
    default                 "no-store";
    ~^/_next/static/         "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your tunnel hostname once cloudflared is routing to this.
    server_name _;

    # cloudflared terminates TLS upstream and forwards plain HTTP here, so there
    # is deliberately no 443 block. If you expose this box directly instead, add
    # one and redirect 80 -> 443; the app already sends HSTS.

    # Every endpoint takes small JSON. Capping this keeps a hostile request from
    # buffering megabytes before auth is ever checked.
    client_max_body_size 64k;

    # nginx's own version banner; the app already masks its Server header.
    server_tokens off;

    # No /api split: the app owns its own routing. Brute-force protection lives
    # in backend/authentication.py (5 failed logins per IP -> 15 min lockout),
    # which counts failures rather than requests, so a limit_req rule here would
    # only add false positives for normal dashboard polling.
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # $remote_addr, NOT $proxy_add_x_forwarded_for. The latter appends to
        # whatever X-Forwarded-For the client sent, so a request that supplies its
        # own header puts an attacker-chosen address in first position — and that
        # first element is what the brute-force lockout in
        # backend/authentication.py keys on, so a caller could rotate the header
        # and never get locked out. nginx is the only trusted hop in front of the
        # app, so it reports the peer it actually saw and discards the rest.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control $serverctl_cache always;

        # /system/upgrade shells out to a package manager and can run long.
        proxy_read_timeout 300s;
    }
}
